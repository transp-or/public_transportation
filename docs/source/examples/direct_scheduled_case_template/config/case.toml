scenario = "inputs/scenario"
# Generated by `run_case.py bootstrap-prior` after the network and approved
# time bins have been reviewed. It is not an unexplained hand-authored input.
scenario_demand = "inputs/scenario/prior_demand.csv"
measurements = "inputs/measurements.csv"
fixed_demand = "inputs/fixed_demand.csv"
results = "results"
package_revision = "REPLACE_WITH_PUBLIC_TRANSPORTATION_COMMIT"
theta = 1.0
rho = 1.0
expected_evaluations = 100
construction_time_budget_seconds = 0.0
safety_margin_seconds = 0.0

# Candidate OD-universe policy. `network_ordered_pairs` and `file` are valid;
# `file` additionally requires `od_pairs_file` with pair-only CSV columns
# origin_stop_id,destination_stop_id. `stop` and `physical_stop` are valid
# levels. `directed_reachable` and `none` are valid connectivity policies.
od_universe_source = "network_ordered_pairs"
od_universe_level = "stop"
od_pairs_file = ""
include_same_stop = false
active_service_only = true
connectivity_policy = "directed_reachable"

# Prior policy. `all_ones` and `external_file` are implemented. The other
# names are reserved and currently raise NotImplementedError:
# `distance_decay`, `travel_time_decay`, `gravity_seed`,
# `destination_attractiveness_seed`.
prior_source = "all_ones"
prior_file = ""
prior_value = 1.0
prior_semantics = "neutral_seed"

# Explicit timetable-feasibility limits used during OD/time expansion.
maximum_transfers = 2
maximum_initial_wait_seconds = 3600
maximum_journey_seconds = 7200
maximum_waiting_seconds = 3600
