[project]
name = "case-study-example"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "public_transportation @ git+https://github.com/transp-or/public_transportation.git@<commit>",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# This case repository contains configuration and data, not an installable
# Python package.  Prevent setuptools from treating config/ or results/ as
# packages during `uv sync`.
[tool.setuptools]
packages = []
